<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lingfield Africa Day 2026</title>

<link rel="icon" type="image/png" href="/icons/favicon.png">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

:root{
    --bg:#ffffff;
    --card:#f5f5f5;
    --text:#111111;
    --muted:#666666;
    --border:#dddddd;
    --accent:#000000;
}

@media (prefers-color-scheme: dark){

    :root{
        --bg:#0d0d0d;
        --card:#161616;
        --text:#ffffff;
        --muted:#9e9e9e;
        --border:#2a2a2a;
        --accent:#ffffff;
    }

}

html{
    scroll-behavior:smooth;
}

body{
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
}

header{
    position:sticky;
    top:0;
    z-index:1000;
    backdrop-filter:blur(14px);
    background:rgba(255,255,255,0.82);
    border-bottom:1px solid var(--border);
    padding:20px 15px;
}

@media (prefers-color-scheme: dark){

    header{
        background:rgba(13,13,13,0.82);
    }

}

.header-inner{
    width:min(1500px,95%);
    margin:auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
}

.logo{
    width:70px;
    height:70px;
    object-fit:contain;
    margin-bottom:12px;
    align-items:left;
}
.logo2{
    width:70px;
    height:70px;
    object-fit:contain;
    margin-bottom:12px;
    align-items:right;
}

h1{
    font-size:clamp(1.7rem,4vw,2.6rem);
    margin-bottom:8px;
}

.subtitle{
    color:var(--muted);
    margin-bottom:20px;
    line-height:1.5;
}

.controls{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    justify-content:center;
    width:100%;
}

.btn{
    border:none;
    outline:none;
    padding:12px 18px;
    border-radius:14px;
    background:var(--accent);
    color:var(--bg);
    cursor:pointer;
    text-decoration:none;
    font-weight:600;
    transition:0.25s ease;
    min-width:170px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.btn:hover{
    transform:translateY(-2px);
    opacity:0.9;
}

.container{
    width:min(1500px,95%);
    margin:auto;
    padding:30px 0;
}

.status{
    text-align:center;
    color:var(--muted);
    margin-bottom:25px;
}

.loader{
    width:48px;
    height:48px;
    border:4px solid var(--border);
    border-top:4px solid var(--accent);
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin:25px auto;
}

@keyframes spin{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:22px;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    overflow:hidden;
    transition:0.3s ease;
    display:flex;
    flex-direction:column;
}

.card:hover{
    transform:translateY(-5px);
}

.image-wrapper{
    position:relative;
}

.select-box{
    position:absolute;
    top:12px;
    left:12px;
    width:22px;
    height:22px;
    z-index:10;
    cursor:pointer;
}

.card img{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    display:block;
    background:#1a1a1a;
}

.card-content{
    padding:15px;
    display:flex;
    flex-direction:column;
    flex:1;
}

.filename{
    margin-bottom:15px;
    line-height:1.5;
    word-break:break-word;
    font-size:0.9rem;
    flex:1;
}

.download-btn{
    width:100%;
    text-align:center;
    text-decoration:none;
    padding:12px;
    border-radius:12px;
    background:var(--accent);
    color:var(--bg);
    font-weight:600;
    transition:0.25s ease;
}

.download-btn:hover{
    opacity:0.88;
}

.bottom-controls{
    display:flex;
    justify-content:center;
    margin-top:40px;
}

.hidden{
    display:none;
}

.selection-bar{
    margin-bottom:25px;
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    justify-content:center;
    align-items:center;
}

.selection-count{
    color:var(--muted);
    font-weight:600;
}

footer{
    border-top:1px solid var(--border);
    margin-top:50px;
    padding:30px 20px;
    text-align:center;
    color:var(--muted);
}

@media (max-width:600px){

    .gallery{
        grid-template-columns:1fr;
    }

    .btn{
        width:100%;
    }

}

</style>

</head>

<body>

<header>

    <div class="header-inner">

        <img src="/icons/favicon.png" class="logo" alt="Logo">
        <img src="/icons/las.png" class="logo2" alt="LAS Logo">

        <h1>Lingfield Africa Day 2026</h1>

        <p class="subtitle">
            Official Client Photo Download Gallery
        </p>

        <div class="controls">

            <a href="https://sammychings27.xyz" class="btn">
                Back to Homepage
            </a>

            <button class="btn" id="refreshBtn">
                Refresh Gallery
            </button>

            <button class="btn" id="downloadAllBtn">
                Download Entire ZIP
            </button>

        </div>

    </div>

</header>

<div class="container">

    <div class="status" id="status">
        Preparing gallery...
    </div>

    <div class="loader" id="loader"></div>

    <div class="selection-bar">

        <div class="selection-count" id="selectionCount">
            0 images selected
        </div>

        <button class="btn" id="downloadSelectedBtn">
            Download Selected
        </button>

    </div>

    <div class="gallery" id="gallery"></div>

    <div class="bottom-controls">

        <button class="btn hidden" id="loadMoreBtn">
            Load More Images
        </button>

    </div>

</div>

<footer>
    © 2026 SammyChings27 Digital — All Rights Reserved
</footer>

<script>

const GITHUB_USERNAME = "sammychings27";
const REPOSITORY_NAME = "interact-global-hub";
const BRANCH = "main";

const FOLDER_PATH = "photos/Lingfield/Africa_day_26";

const API_URL =
`https://api.github.com/repos/${GITHUB_USERNAME}/${REPOSITORY_NAME}/contents/${FOLDER_PATH}?ref=${BRANCH}`;

const ITEMS_PER_PAGE = 30;

let allImages = [];
let currentIndex = 0;
let selectedImages = [];

const gallery = document.getElementById("gallery");
const statusText = document.getElementById("status");
const loadMoreBtn = document.getElementById("loadMoreBtn");
const loader = document.getElementById("loader");
const selectionCount = document.getElementById("selectionCount");

async function fetchImages(){

    try{

        loader.style.display = "block";

        statusText.textContent =
        "Fetching gallery images...";

        const response = await fetch(API_URL);

        if(!response.ok){

            throw new Error("Unable to fetch images.");

        }

        const data = await response.json();

        const validExtensions = [
            ".jpg",
            ".jpeg",
            ".png",
            ".webp",
            ".gif",
            ".JPG",
            ".JPEG",
            ".PNG",
            ".WEBP",
            ".GIF"
        ];

        allImages = data.filter(file =>

            validExtensions.some(ext =>
                file.name.endsWith(ext)
            )

        );

        allImages.reverse();

        if(allImages.length === 0){

            loader.style.display = "none";

            statusText.textContent =
            "No images found.";

            return;

        }

        statusText.textContent =
        `${allImages.length} images available`;

        gallery.innerHTML = "";

        currentIndex = 0;

        renderNextBatch();

        loader.style.display = "none";

    }catch(error){

        console.error(error);

        loader.style.display = "none";

        statusText.textContent =
        "Error loading images.";

    }

}

function renderNextBatch(){

    const nextBatch = allImages.slice(
        currentIndex,
        currentIndex + ITEMS_PER_PAGE
    );

    nextBatch.forEach(file => {

        const rawURL =
        `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${REPOSITORY_NAME}/${BRANCH}/${FOLDER_PATH}/${file.name}`;

        const card = document.createElement("div");

        card.className = "card";

        card.innerHTML = `

            <div class="image-wrapper">

                <input
                    type="checkbox"
                    class="select-box"
                    data-url="${rawURL}"
                    data-name="${file.name}"
                >

                <img
                    src="${rawURL}"
                    alt="${file.name}"
                    loading="lazy"
                >

            </div>

            <div class="card-content">

                <div class="filename">
                    ${file.name}
                </div>

                <a
                    href="${rawURL}"
                    class="download-btn"
                    download
                    target="_blank"
                >
                    Download Image
                </a>

            </div>

        `;

        gallery.appendChild(card);

    });

    setupSelection();

    currentIndex += ITEMS_PER_PAGE;

    if(currentIndex < allImages.length){

        loadMoreBtn.classList.remove("hidden");

    }else{

        loadMoreBtn.classList.add("hidden");

    }

}

function setupSelection(){

    const checkboxes =
    document.querySelectorAll(".select-box");

    checkboxes.forEach(box => {

        box.addEventListener("change", () => {

            const image = {
                url:box.dataset.url,
                name:box.dataset.name
            };

            if(box.checked){

                selectedImages.push(image);

            }else{

                selectedImages =
                selectedImages.filter(
                    item => item.url !== image.url
                );

            }

            selectionCount.textContent =
            `${selectedImages.length} images selected`;

        });

    });

}

async function downloadSelectedImages(){

    if(selectedImages.length === 0){

        alert("Please select images first.");

        return;

    }

    const zip = new JSZip();

    statusText.textContent =
    "Preparing ZIP download...";

    for(const image of selectedImages){

        const response =
        await fetch(image.url);

        const blob =
        await response.blob();

        zip.file(image.name, blob);

    }

    const content =
    await zip.generateAsync({type:"blob"});

    const link =
    document.createElement("a");

    link.href =
    URL.createObjectURL(content);

    link.download =
    "Lingfield_Africa_Day_2026_Selected.zip";

    link.click();

    statusText.textContent =
    `${allImages.length} images available`;

}

loadMoreBtn.addEventListener("click", () => {

    renderNextBatch();

});

document.getElementById("refreshBtn")
.addEventListener("click", () => {

    fetchImages();

});

document.getElementById("downloadAllBtn")
.addEventListener("click", () => {

    const zipURL =
    `https://github.com/${GITHUB_USERNAME}/${REPOSITORY_NAME}/archive/refs/heads/${BRANCH}.zip`;

    window.open(zipURL,"_blank");

});

document.getElementById("downloadSelectedBtn")
.addEventListener("click", () => {

    downloadSelectedImages();

});

fetchImages();

</script>

</body>
</html>
